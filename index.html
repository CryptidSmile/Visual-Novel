<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Visual Novel Work In Progress </title>
    <link rel="stylesheet" href="/styles/background.css"></link>
</head>
<body>
    <div id="game">
        <div id="title-screen">
            <div id="title-bg"></div>
            <button type="button" id="start-btn">Start Game</button>
            <button type="button" id="setting-btn">Settings</button>
        </div>
        <div id="game-screen" hidden>
            <div id="background"></div>
            <div id="character"></div>
            <div id="dialogue-box">
                <div id="speaker"></div>
                <div id="text"></div>            
            </div>
        </div>
        <div id="credit-screen" hidden></div>
        <div id="ending-screen" hidden></div>
        <audio id="bg-music" src="assets/bgm/bg_music.mp3"></audio>    
    </div>
    <script src="/scripts/story.js"></script>
    <script src="/scripts/main.js"></script>
</body>
</html>
