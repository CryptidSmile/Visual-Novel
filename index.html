<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Visual Novel Work In Progress </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/background.css"></link>
</head>
<body>
    <div id="game-screen">
        <div id="title-screen">
            <div id="title-bg"></div>
            <img id="moon-png" src="assets/moon.png">
            <img id="title-png" src="assets/title.png">
            <img id="start-btn" src="assets/start.png">
            <img id="load-btn" src="assets/load.png">
            <img id="setting-btn" src="assets/settings.png">
        </div>
        <div id="story-screen" hidden>
            <div id="background"></div>
            <div id="character"></div>
            <div id="dialogue-box">
                <div id="speaker"></div>
                <div id="text"></div>            
            </div>
        </div>
        <div id="credit-screen" hidden></div>
        <div id="ending-screen" hidden></div>
        <audio id="bg-music" src="assets/bgm/bg_music.mp3"></audio>    
    </div>
    <script src="scripts/story.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
